[project]
name = "fedlex-bench"
version = "0.1.0"
description = "Cross-lingual RAG benchmark over Swiss federal law (DE/FR/IT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "google-adk>=2.12.0",
    "google-genai>=2.31.0",
    "httpx>=0.27",
    "huggingface-hub>=2.2.0",
    "lxml>=5.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "openai>=3.33.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
finetune = [
    "onnx>=1.23.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]
review = [
    "streamlit>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedlex_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
