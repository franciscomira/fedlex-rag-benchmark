<svg class="wf" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 262.0" role="img" aria-labelledby="fig_english-title fig_english-desc"><title id="fig_english-title">Recall@10, English questions only</title><desc id="fig_english-desc">Recall@10, English questions only. No article is in English. Dot: mean. Bar: 95% interval. A corrected 0.24, 95% interval 0.12 to 0.37; T1 0.80, 95% interval 0.68 to 0.90; T2 0.89, 95% interval 0.80 to 0.98; C' 0.86, 95% interval 0.74 to 0.95.</desc><style>svg.wf{--wf-fg:var(--text,#1c1b19);--wf-mut:var(--muted,#5d5a54);--wf-line:var(--line,#d9d5cc);--wf-bg:var(--surface,#ffffff);--wf-base:#6b6b6b;--wf-llm:#b85c00;--wf-tuned:#0072b2;--wf-shipped:#00795a}@media (prefers-color-scheme:dark){svg.wf{--wf-fg:var(--text,#ece9e2);--wf-mut:var(--muted,#aaa69c);--wf-line:var(--line,#3a3832);--wf-bg:var(--surface,#1d1c18);--wf-base:#b5b5b5;--wf-llm:#f2a43a;--wf-tuned:#5eb4ea;--wf-shipped:#3fcfa4}}svg.wf text{fill:var(--wf-fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;paint-order:stroke;stroke:var(--wf-bg);stroke-width:3px;stroke-linejoin:round}svg.wf .wf-ttl{font-size:14px;font-weight:700}svg.wf .wf-sub{fill:var(--wf-mut);font-size:11.5px}svg.wf .wf-mut{fill:var(--wf-mut)}svg.wf .wf-b{font-weight:700}svg.wf .wf-bgrect{fill:var(--wf-bg);stroke:var(--wf-line)}svg.wf .wf-grid{stroke:var(--wf-line);stroke-width:1;fill:none}svg.wf .wf-axis{stroke:var(--wf-mut);stroke-width:1;fill:none}svg.wf .wf-whisk{stroke-width:2.5;fill:none;stroke-linecap:round}svg.wf .wf-base{fill:var(--wf-base);stroke:var(--wf-base)}svg.wf .wf-llm{fill:var(--wf-llm);stroke:var(--wf-llm)}svg.wf .wf-tuned{fill:var(--wf-tuned);stroke:var(--wf-tuned)}svg.wf .wf-shipped{fill:var(--wf-shipped);stroke:var(--wf-shipped)}</style><rect class="wf-bgrect" x="0.5" y="0.5" width="387" height="261.0" rx="6"/><text class="wf-ttl" x="14" y="22">Recall@10, English questions only</text><text class="wf-sub" x="14" y="39">No article is in English. Dot: mean. Bar: 95% interval.</text><line class="wf-grid" x1="14.0" y1="54.0" x2="14.0" y2="238.0"/><line class="wf-grid" x1="70.5" y1="54.0" x2="70.5" y2="238.0"/><line class="wf-grid" x1="127.0" y1="54.0" x2="127.0" y2="238.0"/><line class="wf-grid" x1="183.5" y1="54.0" x2="183.5" y2="238.0"/><line class="wf-grid" x1="240.0" y1="54.0" x2="240.0" y2="238.0"/><text x="14.0" y="71.0"><tspan class="wf-b">A corrected</tspan><tspan class="wf-mut"> hybrid search</tspan></text><line class="wf-whisk wf-base" x1="40.9" y1="89.0" x2="97.4" y2="89.0"/><line class="wf-whisk wf-base" x1="40.9" y1="84.0" x2="40.9" y2="94.0"/><line class="wf-whisk wf-base" x1="97.4" y1="84.0" x2="97.4" y2="94.0"/><circle class="wf-base" cx="67.8" cy="89.0" r="5.5"/><text x="252.0" y="93.0"><tspan class="wf-b">0.24</tspan><tspan class="wf-mut" dx="4">[0.12, 0.37]</tspan></text><text x="14.0" y="117.0"><tspan class="wf-b">T1</tspan><tspan class="wf-mut"> tuned embedder</tspan></text><line class="wf-whisk wf-tuned" x1="167.4" y1="135.0" x2="218.5" y2="135.0"/><line class="wf-whisk wf-tuned" x1="167.4" y1="130.0" x2="167.4" y2="140.0"/><line class="wf-whisk wf-tuned" x1="218.5" y1="130.0" x2="218.5" y2="140.0"/><polygon class="wf-tuned" points="194.3,128.0 201.3,135.0 194.3,142.0 187.3,135.0"/><text x="252.0" y="139.0"><tspan class="wf-b">0.80</tspan><tspan class="wf-mut" dx="4">[0.68, 0.90]</tspan></text><text x="14.0" y="163.0"><tspan class="wf-b">T2</tspan><tspan class="wf-mut"> tuned + reranker</tspan></text><line class="wf-whisk wf-tuned" x1="194.3" y1="181.0" x2="234.6" y2="181.0"/><line class="wf-whisk wf-tuned" x1="194.3" y1="176.0" x2="194.3" y2="186.0"/><line class="wf-whisk wf-tuned" x1="234.6" y1="176.0" x2="234.6" y2="186.0"/><polygon class="wf-tuned" points="215.8,174.0 222.8,181.0 215.8,188.0 208.8,181.0"/><text x="252.0" y="185.0"><tspan class="wf-b">0.89</tspan><tspan class="wf-mut" dx="4">[0.80, 0.98]</tspan></text><text x="14.0" y="209.0"><tspan class="wf-b">C'</tspan><tspan class="wf-mut">