<svg class="wf" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 322.0" role="img" aria-labelledby="fig_cost_latency-title fig_cost_latency-desc"><title id="fig_cost_latency-title">Cost and speed per question</title><desc id="fig_cost_latency-desc">Cost and speed per question. Horizontal axis: cost per question in US dollars. Vertical axis: median latency in seconds, on a log scale. A corrected 0.0000 USD, median 0.08 s; T1 0.0000 USD, median 0.07 s; T2 0.0016 USD, median 1.6 s; C' 0.0024 USD, median 8.0 s; P2 0.0024 USD, median 5.4 s; P3 0.0030 USD, median 11.9 s.</desc><style>svg.wf{--wf-fg:var(--text,#1c1b19);--wf-mut:var(--muted,#5d5a54);--wf-line:var(--line,#d9d5cc);--wf-bg:var(--surface,#ffffff);--wf-base:#6b6b6b;--wf-llm:#b85c00;--wf-tuned:#0072b2;--wf-shipped:#00795a}@media (prefers-color-scheme:dark){svg.wf{--wf-fg:var(--text,#ece9e2);--wf-mut:var(--muted,#aaa69c);--wf-line:var(--line,#3a3832);--wf-bg:var(--surface,#1d1c18);--wf-base:#b5b5b5;--wf-llm:#f2a43a;--wf-tuned:#5eb4ea;--wf-shipped:#3fcfa4}}svg.wf text{fill:var(--wf-fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;paint-order:stroke;stroke:var(--wf-bg);stroke-width:3px;stroke-linejoin:round}svg.wf .wf-ttl{font-size:14px;font-weight:700}svg.wf .wf-sub{fill:var(--wf-mut);font-size:11.5px}svg.wf .wf-mut{fill:var(--wf-mut)}svg.wf .wf-b{font-weight:700}svg.wf .wf-bgrect{fill:var(--wf-bg);stroke:var(--wf-line)}svg.wf .wf-grid{stroke:var(--wf-line);stroke-width:1;fill:none}svg.wf .wf-axis{stroke:var(--wf-mut);stroke-width:1;fill:none}svg.wf .wf-whisk{stroke-width:2.5;fill:none;stroke-linecap:round}svg.wf .wf-base{fill:var(--wf-base);stroke:var(--wf-base)}svg.wf .wf-llm{fill:var(--wf-llm);stroke:var(--wf-llm)}svg.wf .wf-tuned{fill:var(--wf-tuned);stroke:var(--wf-tuned)}svg.wf .wf-shipped{fill:var(--wf-shipped);stroke:var(--wf-shipped)}</style><rect class="wf-bgrect" x="0.5" y="0.5" width="387" height="321.0" rx="6"/><text class="wf-ttl" x="14" y="22">Cost and speed pe