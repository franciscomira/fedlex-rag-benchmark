# Pinned model registry for eval runs. Never use floating aliases here.
# Looked up 2026-10-17 from the providers' docs (source URLs per model).
#
# Notes on pinning:
# - Anthropic: "Every Claude model ID is a pinned snapshot, including the dateless IDs"
#   (https://platform.claude.com/docs/en/models/overview). No separate dated alias exists.
# - OpenAI: the model pages list the bare id as the default and only snapshot.
# - Google: only undated stable codes are published. The pin is the code plus the date above;
#   a silent server-side change cannot be detected, which is why every run stores its cache.
#
# Sampling: Claude 5.x rejects temperature != 1 (HTTP 400), GPT-6 family does not support
# temperature with reasoning on, Gemini 3 docs advise leaving it at default. So `send_temperature`
# is false everywhere; temperature stays part of the cache key and the request object.
# Determinism comes from the disk cache, not from the provider (docs/eval_spec.md section 8).
#
# `effort` is the reasoning/thinking level sent with every call (kept low: cost and latency).
# Reasoning tokens are billed as output tokens, so max_output_tokens must leave room for them.

[meta]
checked = "2026-10-17"

[models."claude-haiku-5-5"]
provider = "anthropic"
tier = "small"
effort = "low"
send_temperature = false
source_url = "https://platform.claude.com/docs/en/models/haiku-5-5/overview"
retrieved = "2026-10-17"

